<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KisanSetu AI — Farm to Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --green-deep:#176B45;
  --green-leaf:#2E8B57;
  --saffron:#E88922;
  --terracotta:#A85D35;
  --cream:#FFF9EE;
  --navy:#17324D;
  --bg-soft:#F5F7F2;
  --white:#FFFFFF;
  --ink:#16211C;
  --ink-soft:#4B5A52;
  --line:#E2E7DE;
  --line-strong:#C9D2C2;
  --sell:#176B45;
  --wait:#B4790C;
  --switch:#17324D;
  --radius-s:6px;
  --radius-m:10px;
  --shadow-1:0 1px 2px rgba(23,50,30,0.06), 0 1px 1px rgba(23,50,30,0.04);
  --shadow-2:0 6px 20px rgba(23,50,30,0.10);
  --font-head:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg-soft);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;color:var(--ink);letter-spacing:-0.01em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
img{max-width:100%;display:block;}
::selection{background:rgba(46,139,87,0.25);}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
@media(max-width:640px){.wrap{padding:0 16px;}}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:var(--radius-s);border:1px solid transparent;
  font-weight:600;font-size:14.5px;transition:background .15s ease, border-color .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--green-deep);color:var(--white);}
.btn-primary:hover{background:#125536;}
.btn-saffron{background:var(--saffron);color:var(--white);}
.btn-saffron:hover{background:#cf7714;}
.btn-outline{background:transparent;color:var(--green-deep);border-color:var(--line-strong);}
.btn-outline:hover{border-color:var(--green-deep);background:rgba(23,107,69,0.05);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;}
.btn-ghost:hover{background:rgba(0,0,0,0.04);}
.btn-danger-outline{background:transparent;color:#A3372B;border:1px solid #E3B3AB;}
.btn-danger-outline:hover{background:#FBEDEB;}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;}

/* App shell */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--white);border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-head);font-weight:800;font-size:19px;color:var(--green-deep);}
.logo .tag{background:var(--saffron);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:0.04em;margin-left:2px;position:relative;top:-7px;}
.nav-links{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;}
.nav-link{padding:9px 14px;border-radius:7px;font-size:14.5px;font-weight:600;color:var(--ink-soft);}
.nav-link:hover{background:var(--bg-soft);color:var(--ink);}
.nav-link.active{color:var(--green-deep);background:rgba(46,139,87,0.10);}
.top-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;color:var(--ink-soft);background:transparent;position:relative;}
.icon-btn:hover{background:var(--bg-soft);color:var(--ink);}
.dot-badge{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--saffron);border:1.5px solid #fff;}
.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;border:1px solid var(--line);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--green-leaf);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.hamburger{display:none;}
@media(max-width:980px){
  .nav-links{display:none;}
  .hamburger{display:flex;}
}

.main-content{flex:1;padding-bottom:40px;}
@media(max-width:980px){.main-content{padding-bottom:88px;}}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--white);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media(max-width:980px){.bottom-nav{display:flex;justify-content:space-around;}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:8px;color:var(--ink-soft);font-size:10.5px;font-weight:600;min-width:56px;}
.bn-item.active{color:var(--green-deep);}
.bn-item svg{width:20px;height:20px;}

/* Cards */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-1);}
.card-pad{padding:22px;}
.section{padding:56px 0;}
.section-sm{padding:32px 0;}
.eyebrow{font-size:12.5px;font-weight:700;color:var(--green-deep);letter-spacing:0.02em;margin-bottom:10px;display:block;}
.section-head{max-width:600px;margin-bottom:36px;}
.section-head h2{font-size:30px;font-weight:800;margin-bottom:10px;}
.section-head p{color:var(--ink-soft);font-size:15.5px;}

/* Landing hero */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0F4A30 0%, var(--green-deep) 55%, #1A7A50 100%);
  color:#fff;padding:64px 0 90px;
}
.hero-bg-pattern{position:absolute;inset:0;opacity:0.10;background-image:
  repeating-linear-gradient(115deg, transparent, transparent 58px, rgba(255,255,255,0.6) 58px, rgba(255,255,255,0.6) 59px);
  pointer-events:none;}
.hero-inner{position:relative;display:grid;grid-template-columns:1.05fr 0.95fr;gap:52px;align-items:center;}
@media(max-width:940px){.hero-inner{grid-template-columns:1fr;}}
.hero h1{font-size:46px;line-height:1.08;font-weight:800;margin-bottom:18px;letter-spacing:-0.02em;}
@media(max-width:640px){.hero h1{font-size:32px;}}
.hero .lede{font-size:18px;color:rgba(255,255,255,0.88);max-width:480px;margin-bottom:14px;}
.hero .sub{font-size:15px;color:rgba(255,255,255,0.68);max-width:500px;margin-bottom:30px;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
.hero .btn-outline{background:transparent;border-color:rgba(255,255,255,0.45);color:#fff;}
.hero .btn-outline:hover{background:rgba(255,255,255,0.1);border-color:#fff;}

.flow-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:22px;backdrop-filter:blur(2px);}
.flow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flow-chip{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:#fff;}
.flow-arrow{color:rgba(255,255,255,0.55);font-size:16px;}
.flow-final{background:var(--saffron);border-color:var(--saffron);}

/* Problem cards */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
@media(max-width:900px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}
.num-card{padding:24px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;}
.num-card .n{font-family:var(--font-head);font-size:13px;font-weight:800;color:var(--saffron);margin-bottom:14px;}
.num-card h3{font-size:17px;margin-bottom:8px;}
.num-card p{color:var(--ink-soft);font-size:14px;}

/* how it works */
.steps-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media(max-width:940px){.steps-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.steps-row{grid-template-columns:1fr;}}
.step-card{padding:20px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;position:relative;}
.step-card .n{width:26px;height:26px;border-radius:50%;background:var(--green-deep);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.step-card h4{font-size:14.5px;margin-bottom:4px;}
.step-card p{font-size:12.5px;color:var(--ink-soft);}

/* Decision badges */
.decision-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;}
.decision-badge svg{width:15px;height:15px;}
.decision-badge.sell{background:rgba(23,107,69,0.12);color:var(--sell);}
.decision-badge.wait{background:rgba(180,121,12,0.14);color:var(--wait);}
.decision-badge.switch{background:rgba(23,50,77,0.10);color:var(--switch);}

.demo-tag{font-size:10.5px;font-weight:700;background:#F2EEE3;color:var(--terracotta);padding:3px 8px;border-radius:5px;letter-spacing:0.02em;border:1px solid #E7DCC6;}

/* Recommendation preview (landing + dashboard) */
.reco-card{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow-2);overflow:hidden;}
.reco-head{background:var(--cream);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.reco-body{padding:24px;}
.reco-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0;}
@media(max-width:520px){.reco-grid{grid-template-columns:1fr;}}
.reco-stat .label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
.reco-stat .val{font-size:16px;font-weight:700;}
.reco-reason{background:var(--bg-soft);border-left:3px solid var(--green-leaf);padding:14px 16px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-soft);}

/* Features */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr;}}
.feat-card{padding:20px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;display:flex;gap:14px;align-items:flex-start;}
.feat-icon{width:38px;height:38px;border-radius:9px;background:rgba(46,139,87,0.10);color:var(--green-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.feat-icon svg{width:19px;height:19px;}
.feat-card h4{font-size:14.5px;margin-bottom:4px;}
.feat-card p{font-size:12.5px;color:var(--ink-soft);}

.final-cta{background:var(--navy);color:#fff;padding:64px 24px;text-align:center;border-radius:18px;margin:0 24px;}
.final-cta h2{font-size:28px;margin-bottom:22px;}
footer{padding:34px 0;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

/* Auth pages */
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
@media(max-width:860px){.auth-shell{grid-template-columns:1fr;}}
.auth-visual{background:linear-gradient(160deg,var(--green-deep),#0F4A30);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;}
@media(max-width:860px){.auth-visual{display:none;}}
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.auth-box{width:100%;max-width:400px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:8px;font-size:14.5px;font-family:var(--font-body);background:#fff;color:var(--ink);}
.field input:focus,.field select:focus{border-color:var(--green-deep);outline:none;box-shadow:0 0 0 3px rgba(23,107,69,0.12);}
.role-tabs{display:flex;gap:8px;margin-bottom:22px;}
.role-tab{flex:1;padding:10px;text-align:center;border:1px solid var(--line-strong);border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft);}
.role-tab.active{border-color:var(--green-deep);background:rgba(23,107,69,0.07);color:var(--green-deep);}

/* Onboarding */
.onboard-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:40px;width:100%;max-width:520px;}
.progress-step{flex:1;height:4px;border-radius:3px;background:var(--line);}
.progress-step.done{background:var(--green-deep);}
.onboard-card{width:100%;max-width:520px;}
.onboard-num{font-family:var(--font-head);font-weight:800;font-size:13px;color:var(--saffron);margin-bottom:6px;}
.chip-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
.chip{padding:9px 15px;border:1px solid var(--line-strong);border-radius:20px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.chip.selected{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}

/* Dashboard layout */
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:flex-start;}
@media(max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.page-header{padding:28px 0 8px;}
.greet{font-size:22px;font-weight:800;}
.loc-line{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
.weather-pill{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;}
.weather-pill .temp{font-size:20px;font-weight:800;}
.weather-pill .desc{font-size:12px;color:var(--ink-soft);}

.section-title{font-size:16px;font-weight:800;margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between;}
.see-all{font-size:12.5px;font-weight:700;color:var(--green-deep);}

.crop-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;margin-bottom:10px;}
.crop-card:hover{border-color:var(--line-strong);}
.crop-main{display:flex;align-items:center;gap:12px;}
.crop-icon{width:42px;height:42px;border-radius:10px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:19px;}
.crop-name{font-weight:700;font-size:14.5px;}
.crop-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.stage-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;}
.stage-tag.mature{background:rgba(23,107,69,0.12);color:var(--green-deep);}
.stage-tag.growing{background:rgba(23,50,77,0.09);color:var(--navy);}
.stage-tag.harvested{background:#EFEFEF;color:#666;}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:10px 12px;border-bottom:1px solid var(--line);}
table.data-table td{padding:13px 12px;border-bottom:1px solid var(--line);}
table.data-table tr.highlight td{background:rgba(46,139,87,0.06);}
table.data-table tr:last-child td{border-bottom:none;}
.table-scroll{overflow-x:auto;}
@media(max-width:760px){
  table.data-table thead{display:none;}
  table.data-table, table.data-table tbody, table.data-table tr, table.data-table td{display:block;width:100%;}
  table.data-table tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:#fff;}
  table.data-table td{border:none;display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;}
  table.data-table td::before{content:attr(data-label);font-weight:700;color:var(--ink-soft);font-size:11.5px;}
}

.badge-pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:12px;}
.badge-high{background:rgba(23,107,69,0.12);color:var(--green-deep);}
.badge-medium{background:rgba(180,121,12,0.14);color:var(--wait);}
.badge-low{background:#EFEFEF;color:#777;}

.wx-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.wx-day{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
.wx-day .d{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
.wx-day .t{font-size:19px;font-weight:800;}
.wx-day .r{font-size:12px;color:var(--terracotta);margin-top:4px;font-weight:600;}
.alert-box{display:flex;gap:12px;padding:14px 16px;border-radius:10px;background:#FBF3E7;border:1px solid #EFD9B0;font-size:13.5px;color:#7A4E0C;align-items:flex-start;margin-top:14px;}
.alert-box svg{flex-shrink:0;width:18px;height:18px;margin-top:1px;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.upload-box{border:1.5px dashed var(--line-strong);border-radius:10px;padding:28px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

.processing-list{display:flex;flex-direction:column;gap:14px;margin:24px 0;}
.proc-item{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--ink-soft);}
.proc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.proc-item.done .proc-check{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}
.proc-item.done{color:var(--ink);}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--green-deep);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Timeline (harvest / transaction) */
.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:16px;position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot-col{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--line-strong);flex-shrink:0;margin-top:3px;}
.tl-dot.active{background:var(--green-deep);box-shadow:0 0 0 4px rgba(23,107,69,0.15);}
.tl-dot.risk{background:var(--saffron);}
.tl-line{width:2px;flex:1;background:var(--line);margin-top:2px;}
.tl-content h4{font-size:14px;margin-bottom:2px;}
.tl-content p{font-size:12.5px;color:var(--ink-soft);}
.tl-item.highlight .tl-content h4{color:var(--green-deep);}

.hl-timeline{display:flex;overflow-x:auto;gap:0;padding:8px 0;}
.hl-node{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px;}
.hl-node .bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:10px;}
.hl-node.done .bar, .hl-node.window .bar{background:var(--green-deep);}
.hl-node.risk .bar{background:var(--saffron);}
.hl-node .lbl{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
.hl-node.window .lbl{color:var(--green-deep);}
.hl-node.risk .lbl{color:var(--terracotta);}

/* decision center */
.alt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0;}
@media(max-width:700px){.alt-row{grid-template-columns:1fr;}}
.alt-card{border:1.5px solid var(--line);border-radius:12px;padding:20px;text-align:center;position:relative;}
.alt-card.selected{border-color:var(--green-deep);background:rgba(23,107,69,0.04);}
.alt-card .alt-badge{margin-bottom:10px;}
.alt-card .alt-note{font-size:12px;color:var(--ink-soft);}
.alt-card .picked-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--green-deep);color:#fff;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:10px;}

.reason-list{display:flex;flex-direction:column;gap:11px;}
.reason-item{display:flex;gap:10px;align-items:flex-start;font-size:14px;}

/* ---------------- ROUTER ---------------- */
function parseHash(){
  let h = location.hash.replace(/^#\/?/, '');
  if(!h) h = '';
  const [path, qs] = h.split('?');
  const params = {};
  if(qs) qs.split('&').forEach(pair=>{ const [k,v] = pair.split('='); if(k) params[k]=decodeURIComponent(v||''); });
  return { path: path || 'landing', params };
}
function navigate(path, params){
  let h = '#/' + path;
  if(params){
    const qs = Object.entries(params).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
    if(qs) h += '?' + qs;
  }
  location.hash = h;
}

  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

const CROP_OPTIONS = ['Tomato','Onion','Potato','Chilli'];
const MARKET_OPTIONS = ['Nashik','Pune','Nagpur','Ahmednagar','Kolhapur'];

function PageOnboarding(){
  const step = STATE.onboardStep;
  const progress = [1,2,3,4].map(n=>`<div class="progress-step ${n<=step?'done':''}"></div>`).join('');
  let body = '';
  if(step===1){
    body = `
    <div class="onboard-num">STEP 01 OF 04</div>
    <h2 style="font-size:22px;margin-bottom:8px;">Your location</h2>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:22px;">This helps us match you to nearby mandis and weather data.</p>
    <div class="field"><label>Village / Town</label><input id="ob-village" type="text" placeholder="e.g. Niphad" value="${STATE.onboardData.village||''}"/></div>
    <div class="field"><label>District</label><input id="ob-district" type="text" placeholder="e.g. Nashik" value="${STATE.onboardData.district||''}"/></div>
    <div class="field"><label>State</label><input id="ob-state" type="text" value="Maharashtra" disabled/></div>`;
  } else if(step===2){
    const chips = CROP_OPTIONS.map(c=>`<div class="chip ${STATE.onboardData.crops.includes(c)?'selected':''}" onclick="toggleOnboardCrop('${c}')">${c}</div>`).join('');
    body = `
    <div class="onboard-num">STEP 02 OF 04</div>
    <h2 style="font-size:22px;margin-bottom:8px;">Your crops</h2>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:10px;">Select all crops you currently grow.</p>
    <div class="chip-grid">${chips}</div>`;
  } else if(step===3){
    body = `
    <div class="onboard-num">STEP 03 OF 04</div>
    <h2 style="font-size:22px;margin-bottom:8px;">Typical quantity</h2>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:22px;">Roughly how much do you harvest per season, per crop?</p>
    <div class="field"><label>Average quantity per harvest</label><input id="ob-qty" type="text" placeholder="e.g. 500 kg" value="${STATE.onboardData.quantity||''}"/></div>
    <div class="field"><label>Typical land under cultivation</label><input id="ob-land" type="text" placeholder="e.g. 2 acres" value="${STATE.onboardData.land||''}"/></div>`;
  } else {
    const chips = MARKET_OPTIONS.map(m=>`<div class="chip ${STATE.onboardData.markets.includes(m)?'selected':''}" onclick="toggleOnboardMarket('${m}')">${m}</div>`).join('');
    body = `
    <div class="onboard-num">STEP 04 OF 04</div>
    <h2 style="font-size:22px;margin-bottom:8px;">Preferred markets</h2>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:10px;">Which mandis would you like KisanSetu to track for you?</p>
    <div class="chip-grid">${chips}</div>`;
  }
  return `
  <div class="onboard-shell">
    <div class="progress-row">${progress}</div>
    <div class="onboard-card card card-pad">
      ${body}
      <div style="display:flex;justify-content:space-between;margin-top:28px;">
        ${step>1?`<button class="btn btn-ghost" onclick="onboardBack()">Back</button>`:`<span></span>`}
        <button class="btn btn-primary" onclick="onboardNext()">${step<4?'Continue':'Finish setup'}</button>
      </div>
    </div>
  </div>`;
}
function toggleOnboardCrop(c){
  const i = STATE.onboardData.crops.indexOf(c);
  if(i>-1) STATE.onboardData.crops.splice(i,1); else STATE.onboardData.crops.push(c);
  render();
}
function toggleOnboardMarket(m){
  const i = STATE.onboardData.markets.indexOf(m);
  if(i>-1) STATE.onboardData.markets.splice(i,1); else STATE.onboardData.markets.push(m);
  render();
}
function onboardBack(){ STATE.onboardStep = Math.max(1, STATE.onboardStep-1); render(); }
function onboardNext(){
  if(STATE.onboardStep===1){
    STATE.onboardData.village = document.getElementById('ob-village').value;
    STATE.onboardData.district = document.getElementById('ob-district').value;
  } else if(STATE.onboardStep===3){
    STATE.onboardData.quantity = document.getElementById('ob-qty').value;
    STATE.onboardData.land = document.getElementById('ob-land').value;
  }
  if(STATE.onboardStep<4){ STATE.onboardStep++; render(); }
  else { showToast('Account set up — welcome to KisanSetu AI'); navigate('dashboard'); }
}

function submitAddCrop(){
  STATE.addCropStage='processing';
  render();
  const steps = document.querySelectorAll('#proc-list .proc-item');
  let i=0;
  function step(){
    if(i>0){ steps[i-1].classList.add('done'); steps[i-1].querySelector('.proc-check').innerHTML = ICON.check; }
    if(i<steps.length){ if(i<steps.length) { steps[i].querySelector('.proc-check').innerHTML = '<div class="spinner"></div>'; } i++; setTimeout(step, 700); }
    else { setTimeout(()=>{ STATE.addCropStage='form'; showToast('Crop analyzed — recommendation ready'); navigate('crop',{id:'tomato'}); }, 500); }
  }
  setTimeout(step, 500);
}

function renderPriceTrendChart(){
  const el = document.getElementById('priceTrendChart');

  const labels7 = ['Mon','Tue','Wed','Thu','Fri','Sat','Today'];
  const labels30 = Array.from({length:30},(_,i)=>`D${i+1}`);
  const base = DEMO.markets.tomato[0].trend;
  const data7 = base;
  const data30 = Array.from({length:30},(_,i)=> 24 + Math.round(Math.sin(i/3)*3) + (i>24? (i-24):0));
  if(window._priceChart) window._priceChart.destroy();
  window._priceChart = new Chart(el, {
    type:'line',
    data:{ labels: STATE.marketRange==='7'?labels7:labels30,
      datasets:[{ label:'Nashik Market (₹/kg)', data: STATE.marketRange==='7'?data7:data30,

    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ y:{ grid:{color:'#EEF1EA'}, ticks:{callback:v=>'₹'+v} }, x:{ grid:{display:false} } } }
  });
}

function PageTransaction(){
  const t = DEMO.transaction;
  const items = t.stages.map((s,i)=>{
    const isLast = i===t.stages.length-1;
    return `<div class="tl-item ${s.done?'highlight':''}">
      <div class="tl-dot-col"><div class="tl-dot ${s.done?'active':''}"></div>${!isLast?'<div class="tl-line"></div>':''}</div>
      <div class="tl-content"><h4>${s.label}</h4><p>${s.date}</p></div>
    </div>`;
  }).join('');
  return AppShell('buyers', `
  <div class="wrap" style="max-width:640px">
    <div class="page-header"><h2 style="font-size:22px;">Transaction Status</h2><p style="color:var(--ink-soft);font-size:14px;margin-top:4px;">${t.crop} · ${t.qty} kg · Buyer: ${t.buyer} · ₹${t.price}/kg</p></div>
    <div class="card card-pad">${items}</div>
  </div>`);
}

function PageAnalytics(){

function renderAnalyticsCharts(){
  const a = DEMO.analytics;
  const el1 = document.getElementById('realizationChart');
  if(el1 && window.Chart){
    if(window._realChart) window._realChart.destroy();
    window._realChart = new Chart(el1, { type:'line',
      data:{ labels:['W1','W2','W3','W4','W5','W6','W7'], datasets:[{ label:'₹/kg', data:a.priceTrend, borderColor:'#2E8B57', backgroundColor:'rgba(46,139,87,0.08)', fill:true, tension:0.35, pointRadius:3 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#EEF1EA'}}, x:{grid:{display:false}} } } });
  }
  const el2 = document.getElementById('cropPerfChart');
  if(el2 && window.Chart){
    if(window._cropChart) window._cropChart.destroy();
    window._cropChart = new Chart(el2, { type:'bar',
      data:{ labels:a.cropPerf.map(c=>c.crop), datasets:[{ label:'₹/kg', data:a.cropPerf.map(c=>c.val), backgroundColor:['#176B45','#2E8B57','#A85D35','#E88922'] }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'#EEF1EA'}}, x:{grid:{display:false}} } } });
  }
}

/* ---------------- MAIN RENDER DISPATCH ---------------- */
function render(){
  const { path, params } = parseHash();
  let html = '';
  let afterRender = null;
  switch(path){
    case '': case 'landing': html = PageLanding(); break;
    case 'login': html = PageLogin(); break;
    case 'onboarding': html = PageOnboarding(); break;
    case 'dashboard': html = PageDashboard(); break;
    case 'crops': html = PageCrops(); break;
    case 'add-crop': html = PageAddCrop(); break;
    case 'crop': html = PageCropDetails(params); break;
    case 'decision': html = PageDecision(params); break;
    case 'market': html = PageMarket(); afterRender = renderPriceTrendChart; break;
    case 'buyers': html = PageBuyers(); break;
    case 'buyer': html = PageBuyerDetail(params); break;
    case 'create-lot': html = PageCreateLot(params); break;
    case 'my-lots': html = PageMyLots(); break;
    case 'offers': html = PageOffers(); break;
    case 'transaction': html = PageTransaction(); break;
    case 'weather': html = PageWeather(); break;
    case 'analytics': html = PageAnalytics(); afterRender = renderAnalyticsCharts; break;
    case 'fpo': html = PageFPO(); break;
    case 'profile': html = PageProfile(); break;
    default: html = PageLanding();
  }
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
  if(afterRender) setTimeout(afterRender, 30);
}
// expose functions used in inline handlers
window.navigate = navigate; window.render = render; window.STATE = STATE; window.showToast = showToast;
window.toggleOnboardCrop = toggleOnboardCrop; window.toggleOnboardMarket = toggleOnboardMarket;
window.onboardBack = onboardBack; window.onboardNext = onboardNext;
window.handleLogin = handleLogin; window.submitAddCrop = submitAddCrop; window.submitCreateLot = submitCreateLot;
window.acceptOffer = acceptOffer; window.rejectOffer = rejectOffer;
window.toggleMobileMenu = toggleMobileMenu; window.closeMobileMenu = closeMobileMenu; window.toggleNotif = toggleNotif;
window.scrollToHow = scrollToHow;
</script>
